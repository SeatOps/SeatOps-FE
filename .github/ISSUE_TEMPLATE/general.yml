
name: "📋 General Task Template"
description: "문서 수정, 스타일 개선, 테스트 작성, 환경 설정 등 일반적인 작업을 진행할 때 생성하는 이슈입니다."
title: "[] "
labels: []
assignees: []

body:
  - type: textarea
    id: description
    attributes:
      label: "📌 작업 설명 (Description)"
      description: "진행하려는 작업의 목적과 배경을 설명해주세요."
      placeholder: |
        예) 프로젝트의 코드 품질을 유지하기 위해 ESLint 설정을 변경합니다.
    validations:
      required: true

  - type: textarea
    id: task-details
    attributes:
      label: "📝 상세 작업 내용 (Details)"
      description: "수정하거나 추가해야 하는 내용을 구체적으로 작성해주세요."
      placeholder: |
        - ESLint 규칙 추가
        - 기존 코드와 충돌하는 규칙 확인
        - 프로젝트 전체 코드 검사
        - 관련 설정 파일 수정
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: "📎 참고 자료 (References)"
      description: "관련 문서, 공식 가이드, 디자인 자료, 기존 이슈 등을 첨부해주세요."
      placeholder: |
        Related Issue:
        Related PR:
        Documentation:
        Reference URL:

  - type: textarea
    id: todo
    attributes:
      label: "📋 작업 내용 (To-Do)"
      description: "작업 진행을 위해 필요한 세부 항목을 작성해주세요."
      value: |
        - [ ] 작업 내용 확인
        - [ ] 관련 파일 및 코드 수정
        - [ ] 변경 사항 검토
        - [ ] 테스트 및 정상 동작 확인
    validations:
      required: true
